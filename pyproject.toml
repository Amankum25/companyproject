[project]
name = "btc-options-straddle"
version = "0.1.0"
description = "BTC ATM Short Straddle using NautilusTrader and Bybit Testnet"
requires-python = ">=3.13"
dependencies = [
    "nautilus-trader==2.0.0rc8",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"

